name: MakiAndino
options:
  bundleIdPrefix: pe.isil.samir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MakiAndino:
    type: application
    platform: iOS
    sources:
      - path: MakiAndino
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Maki Andino
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - GolosText-Regular.ttf
          - GolosText-Medium.ttf
          - GolosText-SemiBold.ttf
          - GolosText-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.isil.samir.makiandino
        TARGETED_DEVICE_FAMILY: "1"
