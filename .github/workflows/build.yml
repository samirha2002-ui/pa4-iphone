name: Compilar iOS y capturas

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      API_BASE: ${{ vars.API_BASE }}
      BUNDLE_ID: pe.isil.samir.makiandino
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Elegir simulador
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 ci/elegir_simulador.py)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulador: $UDID"

      - name: Compilar
        working-directory: ios
        run: |
          xcodebuild build \
            -project MakiAndino.xcodeproj \
            -scheme MakiAndino \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Capturas del simulador
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find ios/build -name "MakiAndino.app" -path "*Debug-iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p capturas
          EXTRA=()
          if [ -n "$API_BASE" ]; then EXTRA=(-api-base "$API_BASE"); fi
          for pantalla in dashboard galeria categorias platos detalle mapa grafico; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -screen "$pantalla" "${EXTRA[@]}"
            sleep 12
            xcrun simctl io "$UDID" screenshot "capturas/$pantalla.png"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas

      - uses: actions/upload-artifact@v4
        with:
          name: proyecto-xcode
          path: |
            ios/MakiAndino.xcodeproj
            ios/MakiAndino
            ios/Info.plist
            ios/project.yml
